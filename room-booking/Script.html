<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var S = { chkMonday: null, token: null, user: null, tab: null, bookMonday: null, reportMonday: null, week: null, report: null, students: null, timer: null, offset: 0 };

  function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  // ---------- 서버 호출 ----------
  function call(fn, args) {
    return new Promise(function (res) {
      try {
        var run = google.script.run
          .withSuccessHandler(function (r) { res(r || { ok: false, msg: '응답이 없습니다.' }); })
          .withFailureHandler(function () { res({ ok: false, msg: '서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.' }); });
        run[fn].apply(run, args);
      } catch (e) { res({ ok: false, msg: '서버 연결 오류가 발생했습니다.' }); }
    });
  }
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return call(fn, [S.token].concat(args)).then(function (r) {
      if (r.code === 'SESSION') { logout(r.msg, true); }
      return r;
    });
  }
  // 실패 응답을 처리하고, 실패면 true 반환
  function bad(r, title) {
    if (r.ok) return false;
    if (r.code !== 'SESSION') dialog(r.title || title || '알림', '<p class="pre">' + esc(r.msg) + '</p>', [{ label: '확인', v: 'ok', cls: 'pri' }], true);
    return true;
  }
  function busy(on) { $('#busy').hidden = !on; }
  function isT() { return S.user && S.user.role === 'teacher'; }

  // ---------- 모달 / 토스트 ----------
  function dialog(title, bodyHtml, buttons, isError) {
    return new Promise(function (res) {
      var root = $('#modalRoot');
      var bg = document.createElement('div');
      bg.className = 'modal-bg no-print';
      bg.innerHTML = '<div class="modal' + (isError ? ' error' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<h2>' + esc(title) + '</h2><div class="body">' + bodyHtml + '</div><div class="acts"></div></div>';
      var acts = $('.acts', bg);
      function close(v, data) { document.removeEventListener('keydown', onKey); if (bg.parentNode) bg.parentNode.removeChild(bg); res({ v: v, data: data }); }
      function onKey(e) { if (e.key === 'Escape') close(null); }
      buttons.forEach(function (b) {
        var el = document.createElement('button');
        el.type = 'button'; el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
        el.onclick = function () { close(b.v, b.collect ? b.collect(bg) : undefined); };
        acts.appendChild(el);
      });
      bg.addEventListener('mousedown', function (e) { if (e.target === bg) close(null); });
      document.addEventListener('keydown', onKey);
      root.appendChild(bg);
      var last = acts.lastChild; if (last) last.focus();
    });
  }
  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  // ---------- 로그인 / 로그아웃 ----------
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('#loginForm button[type=submit]'); btn.disabled = true; $('#loginMsg').textContent = '';
    call('login', [$('#uid').value, $('#upw').value]).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { $('#loginMsg').textContent = r.msg; return; }
      S.token = r.token; store('tok', r.token); $('#upw').value = '';
      enter(r);
    });
  });
  $('#logoutBtn').addEventListener('click', function () {
    call('logout', [S.token]); logout('', false);
  });
  function logout(msg, showDialog) {
    clearInterval(S.timer); S.token = null; S.user = null; store('tok', null);
    $('#mainView').hidden = true; $('#loginView').hidden = false;
    $('#loginMsg').textContent = (!showDialog && msg) ? msg : '';
    if (showDialog && msg) dialog('로그아웃됨', '<p>' + esc(msg) + '</p>', [{ label: '확인', v: 'ok', cls: 'pri' }]);
  }
  function tabsFor(u) {
    if (u.role === 'teacher') return [['report', '📅 예약 달력 출력'], ['book', '🛠 예약 관리'], ['chk', '📷 퇴실 확인'], ['hol', '🚫 휴무일'], ['pw', '🔑 비밀번호']];
    if (u.role === 'manager') return [['report', '📅 예약 달력'], ['pw', '🔑 비밀번호']];
    var t = [['book', '📝 예약하기'], ['mine', '📋 내 예약'], ['chk', '📷 퇴실 확인']];
    if (u.report) t.push(['report', '📅 예약 달력']);
    t.push(['pw', '🔑 비밀번호']);
    return t;
  }
  function enter(r) {
    S.user = r.user; S.offset = r.nowMs - Date.now();
    S.bookMonday = r.defaults.bookMonday; S.reportMonday = r.defaults.reportMonday;
    $('#loginView').hidden = true; $('#mainView').hidden = false;
    $('#whoName').textContent = r.user.name + (r.user.role === 'teacher' ? ' 선생님' : '');
    $('#whoChip').textContent = r.user.role === 'teacher' ? '교사' : (r.user.role === 'manager' ? '매니저' : (r.user.team || '팀 미지정') + (r.user.report ? ' · 매니저' : ''));
    var tabs = tabsFor(r.user);
    $('#tabs').innerHTML = tabs.map(function (t) { return '<button type="button" role="tab" data-tab="' + t[0] + '">' + t[1] + '</button>'; }).join('');
    $$('#tabs button').forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
    go(tabs[0][0]);
  }

  function go(tab) {
    S.tab = tab; clearInterval(S.timer);
    $$('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); b.setAttribute('aria-selected', b.dataset.tab === tab); });
    ({ book: renderBook, mine: renderMine, pw: renderPw, report: renderReport, hol: renderHol, chk: renderChk })[tab]();
  }
  function loading() { $('#content').innerHTML = '<p class="empty-msg">불러오는 중…</p>'; }
  function addWeeks(ymd, n) {
    var p = ymd.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + 7 * n));
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
  }

  // ---------- 예약하기 / 예약 관리 ----------
  function renderBook() {
    loading();
    return api('getWeek', S.bookMonday).then(function (r) {
      if (bad(r)) return;
      S.week = r; S.bookMonday = r.monday;
      $('#content').innerHTML =
        '<div class="weeknav no-print">' +
        '<button class="btn sm" id="wPrev" type="button">◀ 이전 주</button>' +
        '<div class="range">' + esc(r.range) + '</div>' +
        '<button class="btn sm" id="wNext" type="button">다음 주 ▶</button>' +
        '<button class="btn sm ghost" id="wDef" type="button">예약 대상 주로</button></div>' +
        '<div class="banner" id="banner" role="status"></div>' +
        (r.team && r.team.block && r.team.block.blocked ? blockBar(r.team.block) : '') +
        (r.team ? teamPanel(r.team) : '') +
        (r.team ? checkNotice(r.check) : '') +
        (isT()
          ? '<div class="legend no-print"><span><i class="lg free"></i>비어 있음</span><span><i class="lg tcs"></i>예약됨 (팀별 색)</span><span><i class="lg hol"></i>휴무</span></div>'
          : '<div class="legend no-print"><span><i class="lg free"></i>예약 가능</span><span><i class="lg mine"></i>내 예약</span><span><i class="lg team"></i>우리 팀</span><span><i class="lg other"></i>다른 팀</span><span><i class="lg off"></i>예약 불가</span><span><i class="lg hol"></i>휴무</span></div>') +
        '<div class="days" id="days">' + r.days.map(dayHtml).join('') + '</div>';
      $('#wPrev').onclick = function () { S.bookMonday = addWeeks(S.bookMonday, -1); renderBook(); };
      $('#wNext').onclick = function () { S.bookMonday = addWeeks(S.bookMonday, 1); renderBook(); };
      $('#wDef').onclick = function () { call('restore', [S.token]).then(function (x) { if (x.ok) { S.bookMonday = x.defaults.bookMonday; } renderBook(); }); };
      $('#days').addEventListener('click', onSlot);
      startTick();
    });
  }

  function teamPanel(t) {
    function meter(m) {
      var pct = m.max > 0 ? Math.min(100, m.n / m.max * 100) : 100;
      return '<div class="meter"><div class="row"><span>' + esc(m.period) + '</span><b>' + m.n + ' / ' + m.max + '</b></div>' +
        '<div class="bar" aria-hidden="true"><i class="' + (m.n >= m.max ? 'full' : '') + '" style="width:' + pct + '%"></i></div></div>';
    }
    var list = t.list.length
      ? '<div class="tw"><table class="list"><thead><tr><th>날짜</th><th>시간대</th><th>장소</th><th>예약한 사람</th></tr></thead><tbody>' +
        t.list.map(function (x) {
          return '<tr><td>' + esc(x.label) + '</td><td>' + esc(x.period) + '<small class="tm">' + esc(x.time) + '</small></td><td class="pl">' + esc(x.placeName) + '</td><td class="' + (x.mine ? 'me' : '') + '">' + esc(x.name) + (x.mine ? ' (나)' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<p class="muted nores">이 주에는 우리 팀 예약이 아직 없어요.</p>';
    var maxes = t.meters.map(function (m) { return m.max; });
    var note = maxes.every(function (x) { return x === maxes[0]; })
      ? '매주 각 시간대마다 최대 ' + maxes[0] + '회 예약 가능'
      : '매주 ' + t.meters.map(function (m) { return m.period + ' 최대 ' + m.max + '회'; }).join(' · ') + ' 예약 가능';
    return '<section class="card team no-print"><h3>👥 우리 팀 현황 · ' + esc(t.name || '팀 미지정') + '</h3>' +
      '<p class="limitnote">' + esc(note) + '</p>' +
      '<div class="meters">' + t.meters.map(meter).join('') + '</div>' +
      '<div class="members">팀원: ' + esc(t.members.join(', ') || '-') + '</div>' + list + '</section>';
  }

  function slotText(s) {
    var w = S.week.window;
    switch (s.status) {
      case 'free': return isT() ? '비어 있음 · 눌러서 대리 예약' : '예약 가능';
      case 'mine': return s.canCancel ? '내 예약 · 눌러서 취소' : '내 예약';
      case 'team': return '우리 팀 · ' + s.name;
      case 'other': return isT() ? s.team + ' · ' + s.name : '다른 팀';
      case 'holiday': return '휴무' + (s.reason && s.reason !== '휴무' ? ' · ' + s.reason : '');
      case 'closed': return w.state === 'before' ? w.openLabel + ' 오픈' : '예약 마감';
    }
    return '';
  }

  function dayHtml(day, di) {
    var out = '<div class="day"><h3>' + esc(['일', '월', '화', '수', '목', '금', '토'][day.dow] + '요일') + ' <small>' + esc(day.label.replace(/\(.*$/, '')) + '</small></h3>';
    if (day.holiday != null) out += '<div class="holtag">🚫 ' + esc(day.holiday) + '</div>';
    day.periods.forEach(function (p, pi) {
      out += '<div class="ptitle"><b>' + esc(p.name) + '</b><span>' + esc(p.time) + '</span></div>';
      p.slots.forEach(function (s, si) {
        var cls = 'slot ' + s.status + (s.status === 'free' && isT() ? ' tfree' : '') + (s.status === 'other' && isT() && s.ci != null ? ' tcx tc' + s.ci : '');
        var small = (s.status === 'closed' || s.status === 'holiday') ? ' sm' : '';
        out += '<button type="button" class="' + cls + '" data-d="' + di + '" data-p="' + pi + '" data-i="' + si + '"' +
          (s.status === 'closed' || s.status === 'holiday' ? ' aria-disabled="true"' : '') + '>' +
          '<span class="pl">' + esc(s.placeName) + '</span><span class="st' + small + '">' + esc(slotText(s)) + '</span></button>';
      });
    });
    return out + '</div>';
  }

  function onSlot(e) {
    var b = e.target.closest('.slot'); if (!b) return;
    var day = S.week.days[+b.dataset.d], s = day.periods[+b.dataset.p].slots[+b.dataset.i];
    var desc = day.label + ' ' + s.period + ' · ' + s.placeName + '\n' + s.time;
    if (s.status === 'closed') {
      var w = S.week.window;
      var why = w.state === 'before' ? '아직 예약이 열리지 않았어요.\n오픈: ' + w.openLabel : '예약이 마감되었어요.\n마감: ' + w.closeLabel;
      return dialog('예약 불가', '<p class="pre">' + esc(why + '\n(예약·취소는 전주 토요일 08:00 ~ 일요일 18:00)') + '</p>', [{ label: '확인', v: 'ok', cls: 'pri' }]);
    }
    if (s.status === 'holiday') return toast('휴무라서 예약할 수 없어요' + (s.reason ? ': ' + s.reason : ''));
    if (s.status === 'free') return isT() ? teacherBook(s, desc) : book(s, desc, null);
    if (s.canCancel) return cancel(s, desc);
    if (s.status === 'mine') return toast('예약·취소 가능 기간이 지났어요.');
    if (s.status === 'team') return dialog('우리 팀 예약', '<p class="pre">' + esc(desc + '\n예약한 사람: ' + s.name) + '</p><p class="muted">본인이 한 예약만 취소할 수 있어요.</p>', [{ label: '확인', v: 'ok', cls: 'pri' }]);
    return toast('이미 다른 팀이 예약한 자리예요.');
  }

  function book(s, desc, asId) {
    return dialog('예약할까요?', '<p class="pre">' + esc(desc) + '</p>', [{ label: '아니요', v: 'no' }, { label: '예약하기', v: 'yes', cls: 'pri' }]).then(function (d) {
      if (d.v !== 'yes') return;
      return doBook(s, asId);
    });
  }
  function doBook(s, asId) {
    busy(true);
    return api('bookSlot', s.date, s.place, s.period, asId).then(function (r) {
      busy(false);
      if (!r.ok) { bad(r, '예약 불가'); } else { toast('예약되었습니다 ✅'); }
      if (S.token) renderBook();
    });
  }
  function cancel(s, desc) {
    return dialog('예약을 취소할까요?', '<p class="pre">' + esc(desc + (s.name ? '\n예약자: ' + s.name : '') + (s.team && isT() ? '\n팀: ' + s.team : '')) + '</p><p class="muted">일요일 18:00 전이라면 다시 예약할 수 있어요.</p>',
      [{ label: '아니요', v: 'no' }, { label: '예약 취소', v: 'yes', cls: 'danger' }]).then(function (d) {
      if (d.v !== 'yes') return;
      busy(true);
      return api('cancelRes', s.resId).then(function (r) {
        busy(false);
        if (!r.ok) bad(r, '취소 불가'); else toast('취소되었습니다');
        if (S.token) { if (S.tab === 'mine') renderMine(); else renderBook(); }
      });
    });
  }
  function teacherBook(s, desc) {
    var ready = S.students ? Promise.resolve({ ok: true, list: S.students }) : api('listStudents');
    return ready.then(function (r) {
      if (bad(r)) return;
      S.students = r.list;
      if (!r.list.length) return dialog('안내', '<p>[학생] 시트에 팀이 지정된 학생이 없습니다.</p>', [{ label: '확인', v: 'ok', cls: 'pri' }]);
      var opts = r.list.map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.label) + '</option>'; }).join('');
      return dialog('대리 예약', '<p class="pre">' + esc(desc) + '</p><label for="stuSel" class="fld">예약할 학생(팀)</label><select id="stuSel">' + opts + '</select>' +
        '<p class="muted pre" style="font-size:.85rem;margin-top:12px">교사는 예약 기간과 관계없이 예약할 수 있습니다.\n팀 횟수 제한과 중복 규칙은 동일하게 적용됩니다.</p>',
        [{ label: '닫기', v: 'no' }, { label: '예약하기', v: 'yes', cls: 'pri', collect: function (bg) { return $('#stuSel', bg).value; } }]).then(function (d) {
        if (d.v === 'yes') return doBook(s, d.data);
      });
    });
  }

  // ---------- 카운트다운 ----------
  function fmtRemain(ms) {
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (d ? d + '일 ' : '') + h + '시간 ' + m + '분 ' + sec + '초';
  }
  function startTick() {
    clearInterval(S.timer);
    var w = S.week.window, serverState = w.state, mon = S.week.monday, t = isT();
    function upd() {
      var now = Date.now() + S.offset;
      var cur = now < w.openMs ? 'before' : (now < w.closeMs ? 'open' : 'closed');
      var b = $('#banner'); if (!b) { clearInterval(S.timer); return; }
      if (cur !== serverState && S.tab === 'book' && S.week.monday === mon) { clearInterval(S.timer); renderBook(); return; }
      b.className = 'banner ' + cur;
      var x = t ? ' · 교사는 기간 외에도 예약·취소할 수 있어요' : '';
      if (cur === 'before') b.innerHTML = '⏳ <b>예약 오픈까지 ' + fmtRemain(w.openMs - now) + '</b><span>오픈 ' + esc(w.openLabel) + ' ~ 마감 ' + esc(w.closeLabel) + x + '</span>';
      else if (cur === 'open') b.innerHTML = '✅ <b>예약 가능 · 마감까지 ' + fmtRemain(w.closeMs - now) + '</b><span>마감 ' + esc(w.closeLabel) + ' (취소·재예약도 이때까지)' + x + '</span>';
      else b.innerHTML = '🔒 <b>예약이 마감되었습니다</b><span>마감 ' + esc(w.closeLabel) + ' · 조회만 가능해요' + x + '</span>';
    }
    upd(); S.timer = setInterval(upd, 1000);
  }

  // ---------- 내 예약 ----------
  function renderMine() {
    loading();
    api('getMine').then(function (r) {
      if (bad(r)) return;
      var h = '<h2 style="margin-bottom:12px">📋 내 예약</h2>';
      if (!r.list.length) { $('#content').innerHTML = '<div class="center">' + h + '<p class="empty-msg">최근 예약 내역이 없어요.</p></div>'; return; }
      h += '<div class="card tw"><table class="list"><thead><tr><th>날짜</th><th>시간대</th><th>장소</th><th></th></tr></thead><tbody>' +
        r.list.map(function (x, i) {
          return '<tr><td>' + esc(x.label) + (x.past ? '<small class="tm">지남</small>' : '') + '</td><td>' + esc(x.period) + '<small class="tm">' + esc(x.time) + '</small></td><td class="pl">' + esc(x.placeName) + '</td><td>' +
            (x.canCancel ? '<button class="btn sm danger" data-i="' + i + '" type="button">취소</button>' : '<span class="muted">취소 불가</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      $('#content').innerHTML = '<div class="center">' + h + '</div>';
      $$('#content button[data-i]').forEach(function (b) {
        b.onclick = function () {
          var x = r.list[+b.dataset.i];
          cancel({ resId: x.resId, name: '', team: '' }, x.label + ' ' + x.period + ' · ' + x.placeName + '\n' + x.time);
        };
      });
    });
  }

  // ---------- 비밀번호 변경 ----------
  function renderPw() {
    $('#content').innerHTML = '<div class="center narrow"><h2 style="margin-bottom:12px">🔑 비밀번호 변경</h2>' +
      '<form class="card form" id="pwForm"><label for="pw0">현재 비밀번호</label><input id="pw0" type="password" autocomplete="current-password" required>' +
      '<label for="pw1">새 비밀번호 (4자 이상)</label><input id="pw1" type="password" autocomplete="new-password" required minlength="4">' +
      '<label for="pw2">새 비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password" required>' +
      '<p class="err" id="pwMsg" role="alert"></p><button class="btn pri block" type="submit">변경하기</button></form></div>';
    $('#pwForm').onsubmit = function (e) {
      e.preventDefault();
      if ($('#pw1').value !== $('#pw2').value) { $('#pwMsg').textContent = '새 비밀번호가 서로 다릅니다.'; return; }
      busy(true);
      api('changePassword', $('#pw0').value, $('#pw1').value).then(function (r) {

      '<li>제출 시간: 예약한 시간 시작 ~ 당일 <b>방과후 ' + esc(ck.deadlines['방과후']) + ' / 아침 ' + esc(ck.deadlines['아침']) + '</b>까지 · 팀원 누구나 제출할 수 있어요</li>' +
      '<li class="warn">⚠️ 제출하지 않으면 <b>이번 주 토요일 08:00에 열리는 다음 주 예약을 할 수 없어요.</b></li></ul></section>';
  }
  function blockBar(b) {
    return '<div class="blockbar no-print">⛔ <b>지난주 퇴실 확인 사진을 제출하지 않아 이 주 예약이 제한돼요.</b><br><span>' +
      b.list.map(function (x) { return esc(x.label + ' ' + x.period + ' ' + x.placeName); }).join(' · ') + ' · 선생님께 문의하세요</span></div>';
  }

  var camState = { stream: null };
  function stopStream() { if (camState.stream) { camState.stream.getTracks().forEach(function (t) { t.stop(); }); camState.stream = null; } }
  function nowText() { return new Date(Date.now() + S.offset).toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' }); }
  // 사진을 줄이고(최대 1280px) 아래쪽에 시각·팀·장소를 새겨서 JPEG 데이터로 만듭니다.
  function toJpeg(src, w, h, wm) {
    var sc = Math.min(1, 1280 / Math.max(w, h)), cw = Math.round(w * sc), ch = Math.round(h * sc);
    var c = document.createElement('canvas'); c.width = cw; c.height = ch;
    var x = c.getContext('2d'); x.drawImage(src, 0, 0, cw, ch);
    var fs = Math.max(14, Math.round(cw / 38)), pad = Math.round(fs * 0.5);
    x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, ch - fs - pad * 2, cw, fs + pad * 2);
    x.fillStyle = '#fff'; x.font = 'bold ' + fs + 'px sans-serif'; x.textBaseline = 'middle';
    x.fillText(wm, pad, ch - (fs + pad * 2) / 2);
    return c.toDataURL('image/jpeg', 0.72);
  }
  function camError(e) {
    var n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') return '이 화면에서 카메라를 쓸 수 없어요. (카메라 권한이 막혔거나, 이 앱 화면의 보안 설정 때문일 수 있어요)';
    if (n === 'NotFoundError' || n === 'OverconstrainedError') return '카메라를 찾을 수 없어요.';
    return '카메라를 켤 수 없어요.' + (e && e.message ? ' (' + e.message + ')' : '');
  }

  // o: { title, sub, checks(체크리스트 필요), test(테스트 모드), wm(사진에 새길 글), allowApp(카메라 앱 방식 허용) }
  function openCamera(o) {
    return new Promise(function (res) {
      var bg = document.createElement('div'); bg.className = 'modal-bg cam-bg no-print';
      bg.innerHTML = '<div class="modal cam-modal" role="dialog" aria-modal="true" aria-label="' + esc(o.title) + '"><h2>' + esc(o.title) + '</h2>' +
        (o.sub ? '<p class="muted pre cam-sub">' + esc(o.sub) + '</p>' : '') +
        (o.checks ? '<div class="chk-list"><label><input type="checkbox" data-k="light"> 💡 전등을 껐어요 (OFF)</label><label><input type="checkbox" data-k="heat"> 🔥 난방을 껐어요 (OFF)</label><label><input type="checkbox" data-k="lock"> 🔒 문단속을 했어요</label></div>' : '') +
        '<div class="cam-view"><video playsinline muted autoplay></video><img class="cam-shot" alt="촬영한 사진" hidden></div>' +
        '<p class="cam-msg" role="status"></p><div class="acts"></div></div>';
      var v = $('video', bg), img = $('.cam-shot', bg), msg = $('.cam-msg', bg), acts = $('.acts', bg);
      var mode = 'start', result = null;
      var fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.accept = 'image/*'; fileIn.setAttribute('capture', 'environment'); fileIn.hidden = true;
      bg.appendChild(fileIn);
      function checked() { var all = true; $$('input[type=checkbox]', bg).forEach(function (c) { if (!c.checked) all = false; }); return all; }
      function finish(val) { stopStream(); document.removeEventListener('keydown', onKey); if (bg.parentNode) bg.parentNode.removeChild(bg); res(val); }
      function onKey(e) { if (e.key === 'Escape') finish(null); }
      function btn(label, cls, fn, disabled) {
        var b = document.createElement('button'); b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label; b.disabled = !!disabled; b.onclick = fn; acts.appendChild(b); return b;
      }
      function draw() {
        acts.innerHTML = '';
        btn('닫기', '', function () { finish(null); });
        if (mode === 'live') btn('📷 촬영', 'pri', capture);
        if (mode === 'fail' || mode === 'start') {
          btn('🔄 카메라 다시 켜기', '', startLive);
          if (o.allowApp) btn('📱 카메라 앱으로 촬영', '', function () { fileIn.click(); });
        }
        if (mode === 'shot') {
          btn('다시 찍기', '', function () { result = null; img.hidden = true; startLive(); });
          if (!o.test) {
            var sb = btn('✅ 제출하기', 'pri', function () { if (checked()) finish({ photo: result.photo, method: result.method, lastModified: result.lastModified, checks: { light: true, heat: true, lock: true } }); }, !checked());
            sb.className += ' submit-btn';
          }
        }
      }
      function showShot(photo, method, lm) {
        stopStream(); v.hidden = true; img.src = photo; img.hidden = false; result = { photo: photo, method: method, lastModified: lm }; mode = 'shot';
        msg.textContent = o.test ? '✅ 카메라가 잘 작동해요! (' + (method === 'live' ? '앱 안의 실시간 카메라' : '카메라 앱') + ' 방식)' : (checked() ? '사진을 확인하고 제출하세요.' : '위의 3가지를 체크하면 제출할 수 있어요.');
        draw();
      }
      function capture() {
        if (!v.videoWidth) { msg.textContent = '카메라가 아직 준비 중이에요. 잠시 후 다시 눌러 주세요.'; return; }
        showShot(toJpeg(v, v.videoWidth, v.videoHeight, o.wm + ' · ' + nowText()), 'live', Date.now());
      }
      function startLive() {
        stopStream(); mode = 'start'; msg.textContent = '카메라를 켜는 중…'; draw();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { mode = 'fail'; msg.textContent = '이 화면에서는 카메라를 바로 켤 수 없어요.' + (o.allowApp ? ' 아래 [카메라 앱으로 촬영]을 눌러 주세요.' : ' 선생님께 문의하세요.'); draw(); return; }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false }).then(function (st) {
          camState.stream = st; v.srcObject = st; v.hidden = false; img.hidden = true; mode = 'live';
          msg.textContent = '교실 전체가 보이게 맞춘 뒤 [촬영]을 누르세요.'; draw();
          if (v.play) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
        }).catch(function (e) { mode = 'fail'; msg.textContent = camError(e) + (o.allowApp ? '\n[카메라 앱으로 촬영]을 눌러 보세요.' : ''); draw(); });
      }
      fileIn.onchange = function () {
        var f = fileIn.files && fileIn.files[0]; if (!f) return;
        var url = URL.createObjectURL(f), im = new Image();
        im.onload = function () { showShot(toJpeg(im, im.naturalWidth, im.naturalHeight, o.wm + ' · ' + nowText()), 'app', f.lastModified); URL.revokeObjectURL(url); };
        im.onerror = function () { msg.textContent = '사진을 읽을 수 없어요. 다시 촬영해 주세요.'; URL.revokeObjectURL(url); };
        im.src = url; fileIn.value = '';
      };
      $$('input[type=checkbox]', bg).forEach(function (c) {
        c.onchange = function () {
          var sb = $('.submit-btn', bg); if (sb) sb.disabled = !checked();
          if (mode === 'shot' && !o.test) msg.textContent = checked() ? '사진을 확인하고 제출하세요.' : '위의 3가지를 체크하면 제출할 수 있어요.';
        };
      });
      bg.addEventListener('mousedown', function (e) { if (e.target === bg) finish(null); });
      document.addEventListener('keydown', onKey);
      $('#modalRoot').appendChild(bg);
      startLive();
    });
  }

  function testCamera(ck) {

  function renderChkAdmin() {
    loading();
    api('getCheckoutAdmin', S.chkMonday).then(function (r) {
      if (bad(r)) return;
      S.chkMonday = r.monday;
      var items = r.items.map(function (x) { return { x: x, st: liveSt(x) }; });
      var late = {}; items.forEach(function (i) { if (i.st === 'late') late[i.x.team] = true; });
      var lateTeams = Object.keys(late);
      var h = '<div class="center wide"><h2 style="margin-bottom:10px">📷 퇴실 확인 현황</h2>' + chkWeekNav(r.range);
      if (!r.check.enabled) h += '<div class="notice">퇴실 확인 기능이 꺼져 있어요. [설정] 시트의 "퇴실확인 시작일"에 날짜를 적으면 켜집니다.</div>';
      h += lateTeams.length
        ? '<div class="blockbar">⛔ <b>미제출 팀: ' + esc(lateTeams.join(', ')) + '</b><br><span>' + esc(r.nextWeekLabel) + ' 주(다음 주) 예약이 제한됩니다. 사정이 있으면 아래에서 [면제]하세요.</span></div>'
        : '<div class="banner open">✅ <b>미제출 팀이 없어요</b><span>마감 시각이 지난 예약 기준</span></div>';
      if (r.teams.length) {
        h += '<div class="card tw"><table class="list"><thead><tr><th>팀</th><th>대상</th><th>제출</th><th>미제출</th><th>면제</th></tr></thead><tbody>' +
          r.teams.map(function (t) { return '<tr><td>' + esc(t.team) + '</td><td>' + t.total + '</td><td>' + t.done + '</td><td class="' + (late[t.team] ? 'me' : '') + '">' + (late[t.team] ? '⚠ ' : '') + t.late + '</td><td>' + t.excused + '</td></tr>'; }).join('') + '</tbody></table></div>';
      }
      h += '<div class="card chk-card" style="margin-top:12px">';
      if (!items.length) h += '<p class="empty-msg">이 주에는 퇴실 확인 대상(아침·방과후) 예약이 없어요.</p>';
      items.forEach(function (i, k) {
        var x = i.x, canUn = i.st === 'excused' && String(x.reason).indexOf('휴무일') !== 0;
        h += '<div class="chk-item st-' + i.st + '"><div class="l"><b>' + esc(x.label) + ' ' + esc(x.period) + ' · ' + esc(x.placeName) + '</b><small>' + esc(x.team) + ' · 예약 ' + esc(x.reserver) + ' · ' + esc(x.time) + '</small>' +
          '<span class="stt">' + chkStatus(x, i.st) + (x.method ? ' <i class="muted">(' + (x.method === 'live' ? '실시간 카메라' : '카메라 앱') + ')</i>' : '') + '</span></div><div class="btns">' +
          (x.hasPhoto ? '<button class="btn sm" data-a="photo" data-k="' + k + '" type="button">🖼 사진 보기</button>' : '') +
          (i.st === 'wait' || i.st === 'open' || i.st === 'late' ? '<button class="btn sm" data-a="ex" data-k="' + k + '" type="button">면제</button>' : '') +
          (canUn ? '<button class="btn sm" data-a="unex" data-k="' + k + '" type="button">면제 해제</button>' : '') + '</div></div>';
      });
      h += '</div><p style="text-align:center"><button class="btn sm ghost" id="camTest" type="button">📷 카메라 테스트</button></p></div>';
      $('#content').innerHTML = h;
      bindChkNav();
      $('#camTest').onclick = function () { testCamera(r.check); };
      $$('#content button[data-a]').forEach(function (b) {
        b.onclick = function () {
          var x = items[+b.dataset.k].x, a = b.dataset.a;
          if (a === 'photo') {
            busy(true);
            api('getPhoto', x.resId).then(function (p) {
              busy(false); if (bad(p)) return;
              dialog('퇴실 확인 사진', '<img class="photo" alt="제출된 사진" src="' + p.dataUrl + '"><p class="muted" style="font-size:.85rem;margin:8px 0 0">' + esc(x.team + ' · ' + x.label + ' ' + x.period + ' ' + x.placeName) + '<br>제출 ' + esc(p.by) + ' · ' + esc(p.at) + '</p>',
                [{ label: '닫기', v: 'ok', cls: 'pri' }]);
            });
          } else if (a === 'ex') {
            dialog('미제출 면제', '<p class="pre">' + esc(x.team + ' · ' + x.label + ' ' + x.period + ' ' + x.placeName) + '</p><label for="exMemo" class="fld">사유 (선택)</label><input id="exMemo" type="text" placeholder="예: 정전, 행사">',
              [{ label: '취소', v: 'no' }, { label: '면제하기', v: 'yes', cls: 'pri', collect: function (bg) { return $('#exMemo', bg).value; } }]).then(function (d) {
              if (d.v !== 'yes') return;
              busy(true); api('setExempt', x.resId, true, d.data).then(function (z) { busy(false); if (!bad(z)) { toast('면제했어요'); renderChk(); } });
            });
          } else {
            busy(true); api('setExempt', x.resId, false, '').then(function (z) { busy(false); if (!bad(z)) { toast('면제를 해제했어요'); renderChk(); } });
          }
        };
      });
    });
  }

  // ---------- 시작 ----------
  var tok = load('tok');
  if (tok) {
    S.token = tok; busy(true);
    call('restore', [tok]).then(function (r) {
      busy(false);
      if (r.ok) enter(r); else { S.token = null; store('tok', null); }
    });
  }
})();
</script>
